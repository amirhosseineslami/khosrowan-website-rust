<!doctype html>
<html lang="{{ view.base.lang }}" dir="{{ view.base.dir }}" data-theme="{{ view.base.default_theme }}">
<head>
{% include "admin/partials/head.html" %}
</head>
<body>
<div class="admin-body">
  {% include "admin/partials/sidebar.html" %}

  <div class="admin-main">
    <header class="admin-topbar">
      <div>
        <h1 data-lang-key data-lang-en="Social links" data-lang-fa="پیوندهای اجتماعی">Social links</h1>
        <p data-lang-key data-lang-en="Manage the links shown in the site footer and contact page." data-lang-fa="مدیریت پیوندهای نمایشدادهشده در فوتر سایت و صفحه تماس.">Manage the links shown in the site footer and contact page.</p>
      </div>
    </header>

    <div class="admin-content">
      <section class="card">
        <h2 style="font-size:var(--step-1);margin-bottom:1rem;" data-lang-key data-lang-en="Add a link" data-lang-fa="افزودن پیوند">Add a link</h2>
        <form method="post" action="/admin/socials/save" class="form">
          <input type="hidden" name="csrf_token" value="{{ view.csrf_token }}">
          <div class="form-row">
            <div class="field">
              <label for="platform" data-lang-key data-lang-en="Platform" data-lang-fa="پلتفرم">Platform</label>
              <input id="platform" type="text" name="platform" required placeholder="github">
            </div>
            <div class="field">
              <label for="url" data-lang-key data-lang-en="URL" data-lang-fa="نشانی">URL</label>
              <input id="url" type="text" name="url" required placeholder="https://github.com/...">
            </div>
            <div class="field">
              <label for="label" data-lang-key data-lang-en="Label" data-lang-fa="برچسب">Label</label>
              <input id="label" type="text" name="label" placeholder="GitHub">
            </div>
            <div class="field">
              <label for="sort_order" data-lang-key data-lang-en="Order" data-lang-fa="ترتیب">Order</label>
              <input id="sort_order" type="number" name="sort_order" value="0">
            </div>
          </div>
          <div class="form-actions">
            <button class="btn btn-primary btn-sm" type="submit" data-lang-key data-lang-en="Add" data-lang-fa="افزودن">Add</button>
          </div>
        </form>
      </section>

      <section class="card" style="margin-top:var(--space-l);">
        <h2 style="font-size:var(--step-1);margin-bottom:1rem;" data-lang-key data-lang-en="Existing links" data-lang-fa="پیوندهای موجود">Existing links</h2>
        <div class="stack">
          {% for s in view.socials %}
          <form method="post" action="/admin/socials/save" class="form" style="border:1px solid var(--border);border-radius:var(--radius);padding:1rem;">
            <input type="hidden" name="csrf_token" value="{{ view.csrf_token }}">
            <input type="hidden" name="id" value="{{ s.id }}">
            <div class="form-row">
              <div class="field">
                <label data-lang-key data-lang-en="Platform" data-lang-fa="پلتفرم">Platform</label>
                <input type="text" name="platform" value="{{ s.platform }}" required>
              </div>
              <div class="field">
                <label data-lang-key data-lang-en="URL" data-lang-fa="نشانی">URL</label>
                <input type="text" name="url" value="{{ s.url }}" required>
              </div>
              <div class="field">
                <label data-lang-key data-lang-en="Label" data-lang-fa="برچسب">Label</label>
                <input type="text" name="label" value="{{ s.label }}">
              </div>
              <div class="field">
                <label data-lang-key data-lang-en="Order" data-lang-fa="ترتیب">Order</label>
                <input type="number" name="sort_order" value="{{ s.sort_order }}">
              </div>
            </div>
            <div class="form-actions">
              <button class="btn btn-primary btn-sm" type="submit" data-lang-key data-lang-en="Save" data-lang-fa="ذخیره">Save</button>
              <button class="btn btn-sm btn-ghost" type="submit" formaction="/admin/socials/{{ s.id }}/delete" formmethod="post" onclick="return confirm('Delete this link?')" data-lang-key data-lang-en="Delete" data-lang-fa="حذف">Delete</button>
            </div>
          </form>
          {% endfor %}
        </div>
      </section>
    </div>
  </div>
</div>
</body>
</html>
