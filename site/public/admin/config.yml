backend:
  name: github
  repo: amirhosseineslami/khosrowan-website-rust
  branch: master
  # The Client ID of a GitHub OAuth App you create at:
  # https://github.com/settings/developers
  # Default base_url assumes the implicit OAuth flow (see README notes).
  base_url: https://api.github.com
  client_id: YOUR_GITHUB_OAUTH_CLIENT_ID

media_folder: static/assets/img/gallery
public_folder: /assets/img/gallery

publish_mode: editorial_workflow

collections:
  - name: posts
    label: "مقاله‌ها"
    folder: site/content/posts
    create: true
    slug: "{{slug}}"
    identifier_field: title
    editor:
      preview: true
    fields:
      - { label: "عنوان", name: title, widget: string }
      - { label: "تاریخ", name: date, widget: datetime }
      - { label: "شرح کوتاه", name: description, widget: text, required: false }
      - { label: "دسته‌ها", name: categories, widget: list, required: false }
      - { label: "برچسب‌ها", name: tags, widget: list, required: false }
      - { label: "برگزیده", name: featured, widget: boolean, default: false }
      - { label: "محتوا", name: body, widget: markdown }

  - name: projects
    label: "پروژه‌ها"
    folder: site/content/projects
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: "عنوان", name: title, widget: string }
      - { label: "تاریخ", name: date, widget: datetime }
      - { label: "شرح کوتاه", name: description, widget: text, required: false }
      - { label: "تکنولوژی‌ها", name: tech, widget: list, required: false }
      - { label: "لینک مخزن", name: repo_url, widget: string, required: false }
      - { label: "لینک زنده", name: live_url, widget: string, required: false }
      - { label: "برگزیده", name: featured, widget: boolean, default: false }
      - { label: "محتوا", name: body, widget: markdown }

  - name: pages
    label: "صفحات"
    folder: site/content/pages
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: "عنوان", name: title, widget: string }
      - { label: "محتوا", name: body, widget: markdown }
