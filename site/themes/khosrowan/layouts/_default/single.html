{{ define "main" }}
<article class="container narrow">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
    {{ with .Date }}<time datetime="{{ . }}">{{ .Format "2006-01-02" }}</time>{{ end }}
    {{ with .Params.categories }}<div class="post-tags">{{ range . }}<span class="tag">{{ . }}</span>{{ end }}</div>{{ end }}
  </header>
  <div class="prose">
    {{ .Content }}
  </div>
</article>
{{ end }}
