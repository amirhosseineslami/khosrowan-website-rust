<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" width="520" height="520" role="img" aria-label="Abstract portrait illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2130"/>
      <stop offset="55%" stop-color="#131722"/>
      <stop offset="100%" stop-color="#0c0f16"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><circle cx="260" cy="260" r="250"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="520" height="520" fill="url(#bg)"/>
    <rect width="520" height="520" fill="url(#glow)"/>

    <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
      <path d="M0 130h520M0 260h520M0 390h520M130 0v520M260 0v520M390 0v520"/>
    </g>

    <!-- shoulders -->
    <path d="M92 520c0-96 75-166 168-166s168 70 168 166z" fill="#171c27"/>
    <path d="M92 520c0-96 75-166 168-166s168 70 168 166z" fill="none" stroke="url(#ring)" stroke-opacity="0.5" stroke-width="2"/>

    <!-- neck -->
    <path d="M226 320h68v78h-68z" fill="#2a3140"/>

    <!-- head -->
    <circle cx="260" cy="228" r="96" fill="#2a3140"/>
    <circle cx="260" cy="228" r="96" fill="none" stroke="url(#ring)" stroke-opacity="0.65" stroke-width="2"/>

    <!-- hair -->
    <path d="M164 224c0-58 43-100 96-100s96 42 96 100c-14-26-40-42-72-42-58 0-104 22-120 42z" fill="#0e121a"/>
    <path d="M164 224c0-58 43-100 96-100s96 42 96 100" fill="none" stroke="url(#ring)" stroke-opacity="0.8" stroke-width="2.5"/>

    <!-- glasses -->
    <g stroke="#e8ecf3" stroke-opacity="0.55" stroke-width="3" fill="none">
      <rect x="196" y="212" width="52" height="36" rx="12"/>
      <rect x="272" y="212" width="52" height="36" rx="12"/>
      <path d="M248 230h24M188 226l-16-6M332 226l16-6"/>
    </g>

    <!-- smile -->
    <path d="M234 276c14 12 38 12 52 0" stroke="#e8ecf3" stroke-opacity="0.6" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- code accent -->
    <g opacity="0.5" stroke="#22d3ee" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M52 90l-22 26 22 26"/>
      <path d="M104 90l22 26-22 26"/>
      <path d="M86 78l-16 76"/>
    </g>
  </g>

  <circle cx="260" cy="260" r="248" fill="none" stroke="url(#ring)" stroke-width="3" stroke-opacity="0.85"/>
</svg>
