[package]
name = "personal-site"
version = "1.0.0"
edition = "2021"
rust-version = "1.80"
description = "A production-ready personal website, blog and CMS built entirely in Rust."
authors = ["Amir <hello@example.com>"]
license = "MIT"
readme = "README.md"
default-run = "personal-site"

[[bin]]
name = "personal-site"
path = "src/main.rs"

[dependencies]
# --- Web stack -------------------------------------------------------------
axum = { version = "0.8", features = ["macros", "multipart", "http2"] }
axum-extra = { version = "0.10", features = ["cookie", "typed-header"] }
tower = { version = "0.5", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.6", features = [
    "compression-gzip",
    "compression-br",
    "trace",
    "fs",
    "limit",
    "set-header",
    "catch-panic",
    "normalize-path",
    "redirect",
    "request-id",
] }
http = "1"
http-body-util = "0.1"
bytes = "1"

# --- Async runtime ---------------------------------------------------------
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"

# --- Serialisation ---------------------------------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"

# --- Database --------------------------------------------------------------
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "chrono",
    "uuid",
    "macros",
    "migrate",
] }

# --- Templating ------------------------------------------------------------
askama = "0.16"

# --- Content processing ----------------------------------------------------
comrak = "0.57"
ammonia = "4"

# --- Auth & crypto ---------------------------------------------------------
argon2 = "0.5"
password-hash = { version = "0.5", features = ["getrandom"] }
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
subtle = "2"
uuid = { version = "1", features = ["v4", "serde"] }

# --- Utilities -------------------------------------------------------------
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
slug = "0.1"
once_cell = "1"
mime_guess = "2"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
] }
rust-embed = "8"
dotenvy = "0.15"
percent-encoding = "2"
unicode-segmentation = "1"
time = { version = "0.3", default-features = false, features = ["std"] }

# --- Mail ------------------------------------------------------------------
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "tokio1-rustls-tls",
    "builder",
] }

# --- Observability ---------------------------------------------------------
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = 1
